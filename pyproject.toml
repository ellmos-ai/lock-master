[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lock-master"
version = "1.5.1"
description = "Portable, zero-dependency multi-agent file-lock system — Exclusive and Team Locks (LOCK*.txt)"
readme = "README.md"
authors = [
  { name = "Lukas Geiger" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "agent-coordination",
  "ai-agents",
  "cli",
  "developer-tools",
  "file-locking",
  "llm",
  "multi-agent",
  "python",
  "workflow",
  "zero-dependency",
  "claude-code",
  "codex-cli",
  "local-first",
  "lock-files",
  "cloud-sync",
  "team-coordination"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/lock-master#readme"
Repository = "https://github.com/ellmos-ai/lock-master.git"
Issues = "https://github.com/ellmos-ai/lock-master/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools]
py-modules = [
  "bulk_lock",
  "lock_create",
  "lock_scan",
  "lock_status",
  "lock_utils",
  "permissions",
  "prune_stale_locks"
]
