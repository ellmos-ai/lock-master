[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lock-master"
version = "1.6.3"
description = "Portable, zero-dependency multi-agent file-lock system — Exclusive and Team Locks (LOCK*.txt)"
readme = "README.md"
authors = [
  { name = "Lukas Geiger" }
]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
dependencies = []
keywords = [
  "agent-coordination",
  "ai-agents",
  "automation",
  "cli",
  "developer-tools",
  "file-locking",
  "llm",
  "multi-agent",
  "python",
  "workflow",
  "zero-dependency",
  "claude-code",
  "codex-cli",
  "local-first",
  "zero-egress",
  "lock-files",
  "cloud-sync",
  "team-coordination",
  "ellmos-ai",
  "open-bricks"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/lock-master#readme"
Documentation = "https://github.com/ellmos-ai/lock-master/blob/main/LOCK-SYSTEM.md"
Contributing = "https://github.com/ellmos-ai/lock-master/blob/main/CONTRIBUTING.md"
Repository = "https://github.com/ellmos-ai/lock-master.git"
"Bug Tracker" = "https://github.com/ellmos-ai/lock-master/issues"
Changelog = "https://github.com/ellmos-ai/lock-master/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/lock-master/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/lock-master/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/lock-master/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/lock-master/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/lock-master/blob/main/LICENSE"
"Marketing Log" = "https://github.com/ellmos-ai/lock-master/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/lock-master/blob/main/llms.txt"
Notice = "https://github.com/ellmos-ai/lock-master/blob/main/NOTICE"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0"
]

[project.scripts]
lock-master-team = "team_lock:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".ruff_cache", "build", "dist", ".pytest_temp", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools]
py-modules = [
  "bulk_lock",
  "lock_create",
  "lock_scan",
  "lock_status",
  "lock_utils",
  "permissions",
  "prune_stale_locks",
  "team_lock"
]
packages = ["_lock_master_team"]
package-dir = { "_lock_master_team" = "team-lock/_lock_master_team" }
