[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lock-master"
version = "1.6.2"
description = "Portable, zero-dependency multi-agent file-lock system — Exclusive and Team Locks (LOCK*.txt)"
readme = "README.md"
authors = [
  { name = "Lukas Geiger" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "agent-coordination",
  "ai-agents",
  "cli",
  "developer-tools",
  "file-locking",
  "llm",
  "multi-agent",
  "python",
  "workflow",
  "zero-dependency",
  "claude-code",
  "codex-cli",
  "local-first",
  "lock-files",
  "cloud-sync",
  "team-coordination"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/lock-master#readme"
Documentation = "https://github.com/ellmos-ai/lock-master/blob/main/LOCK-SYSTEM.md"
Repository = "https://github.com/ellmos-ai/lock-master.git"
"Bug Tracker" = "https://github.com/ellmos-ai/lock-master/issues"
Changelog = "https://github.com/ellmos-ai/lock-master/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/lock-master/blob/main/SECURITY.md"

[project.scripts]
lock-master-team = "team_lock:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools]
py-modules = [
  "bulk_lock",
  "lock_create",
  "lock_scan",
  "lock_status",
  "lock_utils",
  "permissions",
  "prune_stale_locks",
  "team_lock"
]
packages = ["_lock_master_team"]
package-dir = { "_lock_master_team" = "team-lock/_lock_master_team" }
